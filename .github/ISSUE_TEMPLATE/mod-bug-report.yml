name: "Mod Bug Report"
description: Report a bug in the mod this repository holds (not a vanilla/base-game bug).
labels: ["bug", "needs-triage"]
type: "bug"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing this mod! This form is **only** for bugs in the mod.
        For a bug in the vanilla/base game, please refer to https://github.com/open-goal/jak-project/issues
  - type: dropdown
    attributes:
      label: Game
      description: Which game is the mod running on?
      options:
        - Jak 1
        - Jak 2
        - Jak 3
    validations:
      required: true

  - type: input
    attributes:
      label: Mod Version
      description: >
        The version tag you installed (e.g. `v1.0.0`, visible in the Launcher's mod page or in
        this repo's Releases). If you built it yourself from source, give the commit hash
        (`git rev-parse HEAD`) instead.
      placeholder: v1.0.0
    validations:
      required: true

  - type: dropdown
    attributes:
      label: How did you install this mod?
      options:
        - "OpenGOAL Launcher (mod catalog / 1-click install)"
        - "Debug build (compiled from source myself)"
        - "Other (manual zip install, specify below)"
    validations:
      required: true

  - type: textarea
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior, as precisely as possible (location, task/mission state, what you pressed).
      placeholder: |
        1. Go to '...'
        2. Trigger '...'
        3. See error
    validations:
      required: true

  - type: textarea
    attributes:
      label: Attachments (screenshots, GIF or video)
      description: >
        Drag and drop image, GIF or video files directly into this box (GitHub hosts them for
        you) — this is the fastest way for us to confirm a visual/gameplay bug. If the video is
        too large to attach here, paste a link to it instead.
    validations:
      required: false

  - type: textarea
    attributes:
      label: Environment Information
      description: "CPU, GPU, OS Version, and the OpenGOAL Version shown in the window's title bar. You can also attach the Launcher's Support Package here."
    validations:
      required: false
